name: Launcher candidate qualification (testing fork only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-launcher
          ref: f0cb3b0439d15cae02d806e5ddc0132fd487c89c
          persist-credentials: false
      - name: Apply exact private candidate
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/candidate.patch
          echo 'a0f9fea4a7646ee088547308e9461c4100dadb372b026092d2890f2810f10454  /tmp/candidate.patch' | sha256sum --check
          git apply --check /tmp/candidate.patch
          git apply /tmp/candidate.patch
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Stable Rust and WASM target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Full unchanged gate with no saved account credentials
        run: |
          env -i HOME="$HOME" PATH="$PATH" CARGO_TERM_COLOR=always RUST_BACKTRACE=1 cargo xtask ci
